<!doctype html>
<!-- Página FALSA do Blip para teste. Estrutura DEDUZIDA (componentes bds-* com Shadow DOM e slot),
     não copiada do site real. Dados de cliente são fictícios. -->
<html lang="pt-BR"><head><meta charset="utf-8"><title>Blip Desk (falso)</title>
<style>body{font-family:sans-serif} .oculto{display:none}</style></head>
<body>
  <header><bds-typo id="atendente">Atendente Rodrigo Pinheiro</bds-typo></header>
  <ul id="fila">
    <li class="ticket"><bds-typo>Maria da Silva Souza</bds-typo> <span class="tel">88993505390 ; 85996918465</span></li>
    <li class="ticket"><bds-typo>Kleber Nogueira</bds-typo> <span class="mail">kleber.n@gmail.com</span></li>
  </ul>
  <div class="aviso"><bds-typo>Este contato já está em atendimento</bds-typo></div>
  <bds-button id="enviar" variant="primary">Resposta Privada</bds-button>
  <input id="busca" type="text">
  <div class="oculto" id="escondido">menu fechado</div>
  <!-- DEDUZIDO: modal de transferir como <dialog> aberto com showModal() dentro da sombra de um bds-modal -->
  <bds-modal id="modal-transferir"></bds-modal>
  <!-- DEDUZIDO: modal que intercepta cliques fora dele (como bibliotecas de "focus trap"):
       fundo escuro comum + ouvintes na fase de captura do document que cancelam o evento -->
  <bds-modal-trava id="modal-trava"></bds-modal-trava>
  <iframe id="quadro" srcdoc="<p id='dentro'>CPF 123.456.789-09</p>"></iframe>
<script>
  const folha = new CSSStyleSheet(); folha.replaceSync('button{color:rgb(255, 0, 0)}');
  customElements.define('bds-typo', class extends HTMLElement {
    constructor(){ super(); this.attachShadow({mode:'open'}).innerHTML = '<p class="typo"><slot></slot></p>'; }
  });
  customElements.define('bds-button', class extends HTMLElement {
    constructor(){ super(); const r = this.attachShadow({mode:'open'}); r.adoptedStyleSheets=[folha];
      r.innerHTML = '<button class="button" part="button"><slot></slot></button>'; }
  });
  customElements.define('bds-modal', class extends HTMLElement {
    constructor(){ super(); this.attachShadow({mode:'open'}).innerHTML =
      '<dialog id="dlg" style="width:500px;height:400px"><h2>Transferir atendimento do Ticket #3227967</h2><button id="cancelar">Cancelar</button></dialog>'; }
    abrir(){ this.shadowRoot.getElementById('dlg').showModal(); }
    fechar(){ this.shadowRoot.getElementById('dlg').close(); }
  });
  customElements.define('bds-modal-trava', class extends HTMLElement {
    constructor(){ super(); this.attachShadow({mode:'open'}).innerHTML =
      '<div id="fundo" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10000">' +
      '<div id="caixa" style="background:#fff;width:500px;margin:80px auto;padding:20px">' +
      '<h2>Transferir atendimento do Ticket #3228038</h2><button id="cancelar">Cancelar</button></div></div>';
      const caixa = this.shadowRoot.getElementById('caixa');
      const fora = e => !e.composedPath().includes(caixa);
      this._bloq = e => { if (fora(e)) { e.preventDefault(); e.stopImmediatePropagation(); } };
      this._foco = e => { if (fora(e)) { e.stopImmediatePropagation(); this.shadowRoot.getElementById('cancelar').focus(); } };
    }
    abrir(){ this.shadowRoot.getElementById('fundo').style.display='block';
      ['mousedown','pointerdown','touchstart','click','keydown','wheel'].forEach(t=>document.addEventListener(t,this._bloq,{capture:true,passive:false}));
      document.addEventListener('focusin',this._foco,true); }
    fechar(){ this.shadowRoot.getElementById('fundo').style.display='none';
      ['mousedown','pointerdown','touchstart','click','keydown','wheel'].forEach(t=>document.removeEventListener(t,this._bloq,{capture:true}));
      document.removeEventListener('focusin',this._foco,true); }
  });
  document.getElementById('busca').value = 'João Pereira 85996918465';
</script>
</body></html>
